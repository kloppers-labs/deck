<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horse Tinder — Find Your Equine Match</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://images.unsplash.com">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🐎</span>
        <h1>Horse Tinder</h1>
      </div>
      <p class="tagline">Swipe to find your perfect equine partner</p>
    </header>

    <main class="cards-stage" id="cardsStage" role="list" aria-label="Horse profiles">
      <!-- Cards injected here -->
    </main>

    <div class="action-bar" role="group" aria-label="Swipe actions">
      <button class="action-btn pass-btn" id="passBtn" aria-label="Pass (Nope)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span class="btn-label">Pass</span>
      </button>
      
      <button class="action-btn super-like-btn" id="superLikeBtn" aria-label="Super Like">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
        </svg>
        <span class="btn-label">Super</span>
      </button>
      
      <button class="action-btn like-btn" id="likeBtn" aria-label="Like (Yep)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span class="btn-label">Like</span>
      </button>
    </div>

    <div class="status-indicators" id="statusIndicators" aria-live="polite" aria-atomic="true">
      <div class="status-indicator like-indicator" data-direction="like">
        <span>LIKE</span>
      </div>
      <div class="status-indicator pass-indicator" data-direction="pass">
        <span>PASS</span>
      </div>
      <div class="status-indicator super-indicator" data-direction="super">
        <span>SUPER LIKE</span>
      </div>
    </div>

    <footer class="app-footer">
      <p>Images from <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a> • Built with vanilla JS</p>
    </footer>
  </div>

  <template id="cardTemplate">
    <article class="horse-card" role="listitem">
      <div class="card-image" style="background-image: var(--horse-image)"></div>
      <div class="card-gradient"></div>
      <div class="card-content">
        <div class="horse-info">
          <h2 class="horse-name"><span class="name"></span> <span class="age"></span></h2>
          <p class="horse-breed"></p>
          <p class="horse-location"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><span class="location"></span></p>
        </div>
        <div class="horse-traits"></div>
      </div>
      <div class="swipe-hint swipe-left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg> Pass</div>
      <div class="swipe-hint swipe-right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 4L4 20M4 4l18 18"></path></svg> Like</div>
    </article>
  </template>

  <script src="script.js" type="module"></script>
</body>
</html>
